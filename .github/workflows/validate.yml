name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up just
        uses: extractions/setup-just@v3
        with:
          just-version: '1.59.0'

      - name: Install validation dependencies
        run: just setup

      - name: Check scripts and actual just wrappers
        run: just check

      - name: Read-only checkout diagnostics
        run: just doctor


  secrets:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@v3
        with:
          just-version: '1.59.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same redacted entry point as local use, with a pinned read-only container.
      - name: Scan full Git history
        run: just secrets --container
